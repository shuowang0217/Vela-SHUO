name: vela_shuo
description: Vela cross-platform network client.
publish_to: none
version: 1.11.1+64

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  country_flags: ^4.1.2
  file_selector: ^1.1.0
  yaml: ^3.1.3
  dio: ^5.9.0
  url_launcher: ^6.3.2
  # Original FlClash Windows native system-proxy plugin, pinned to the SAME
  # source revision as the Go core. No FlClash Flutter screens are included.
  proxy:
    git:
      url: https://github.com/chen08209/FlClash.git
      ref: 4b59eca853778d4e7be3de26589252889c899bc5
      path: plugins/proxy
  window_manager: ^0.5.2
  tray_manager: 0.5.3
  ffi: ^2.2.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/selected_oil_identity.webp
    - assets/brand/vela_selected_icon.png
    - assets/brand/vela_selected_wordmark.png
    - assets/oil/oil_map_clean.webp
    - assets/oil/oil_map_night.webp
    - assets/oil/oil_sea_grid.txt
    - assets/oil/oil_atlas_day.webp
    - assets/oil/oil_atlas_night.webp
    - assets/oil/ui/oil_canvas.webp
    - assets/oil/ui/oil_canvas_night.webp
    - assets/oil/ui/connection_plaque.png
    - assets/oil/ui/night_connection_plaque.png
    - assets/oil/ui/speed_plaque.png
    - assets/oil/ui/night_speed_plaque.png
    - assets/oil/ui/paint_medallion.png
    - assets/oil/ui/night_paint_medallion.png
    - assets/oil/ui/power_medallion.png
    - assets/oil/ui/oil_nav_book.png
    - assets/oil/ui/oil_nav_compass.png
    - assets/oil/ui/oil_nav_helm.png
    - assets/oil/ui/night_oil_nav_book.png
    - assets/oil/ui/night_oil_nav_compass.png
    - assets/oil/ui/night_oil_nav_helm.png
    - assets/oil/ui/night_power_medallion.png
    - assets/oil/clouds/cloud_beijing.png
    - assets/oil/clouds/cloud_beijing_clean.png
    - assets/oil/clouds/night_cloud_beijing_clean.png
