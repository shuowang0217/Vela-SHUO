name: Vela-SHUO CI - Windows EXE only

on:
  push:
    branches: [main, feature/mihomo-live-selector]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vela-windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  verify:
    name: Flutter static analysis and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - name: Generate official Flutter platform scaffolding
        run: flutter create --project-name vela_shuo --org com.shuowang --platforms windows .
      - run: flutter pub get
      - name: Dart formatting
        run: dart format lib test
      - name: Flutter analyzer
        run: flutter analyze
      - name: Widget and identity tests
        run: flutter test --reporter expanded

  windows:
    name: Windows x64 portable EXE
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - name: Generate Windows runner
        run: flutter create --project-name vela_shuo --org com.shuowang --platforms windows .
      - run: flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Windows Job Object lifetime smoke test
        run: flutter test test/windows_job_object_test.dart
      - name: Bundle verified official Mihomo Windows x64 core
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.19.32'
          $asset = "mihomo-windows-amd64-compatible-v$version.zip"
          $expectedSha256 = '974a4d7ad69aed27aa2e8f91d61113573c14dadb14562c63e58effabf59816f0'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $url = "https://github.com/MetaCubeX/mihomo/releases/download/v$version/$asset"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expectedSha256) {
            throw "Mihomo upstream SHA256 mismatch: expected $expectedSha256 got $actual"
          }
          $out = Join-Path $env:RUNNER_TEMP 'vela-official-mihomo'
          Expand-Archive -Path $archive -DestinationPath $out -Force
          $binary = Get-ChildItem $out -File -Recurse |
            Where-Object { $_.Name -match '^mihomo.*\.exe$' } |
            Select-Object -First 1
          if (-not $binary) { throw 'Official Mihomo archive did not contain an executable' }
          $release = Get-ChildItem 'build/windows' -Directory -Recurse |
            Where-Object { $_.Name -eq 'Release' -and
              (Test-Path (Join-Path $_.FullName 'vela_shuo.exe')) } |
            Select-Object -First 1
          if (-not $release) { throw 'Windows Release directory missing' }
          $coreDir = Join-Path $release.FullName 'core'
          New-Item -ItemType Directory -Force -Path $coreDir | Out-Null
          Copy-Item -Path $binary.FullName -Destination (Join-Path $coreDir 'mihomo.exe')
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MetaCubeX/mihomo/main/LICENSE" -OutFile (Join-Path $coreDir 'LICENSE-mihomo.txt')
          Copy-Item 'third_party/mihomo/NOTICE.md' (Join-Path $coreDir 'MIHOMO-NOTICE.md')
          & (Join-Path $coreDir 'mihomo.exe') -t -d $env:RUNNER_TEMP -f 'test/fixtures/mihomo-lab-smoke.json'
          if ($LASTEXITCODE -ne 0) { throw 'Official Mihomo rejected the minimal Vela selector test configuration' }
          Write-Output "Bundled SHA256 verified Mihomo v$version $actual"
      - name: Package with DLLs and data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-ChildItem -Path 'build/windows' -Directory -Recurse |
            Where-Object { $_.Name -eq 'Release' -and (Test-Path (Join-Path $_.FullName 'vela_shuo.exe')) } |
            Select-Object -First 1
          if (-not $release) { throw 'Expected Windows binary was not found' }
          Rename-Item -Path (Join-Path $release.FullName 'vela_shuo.exe') -NewName 'Vela-SHUO.exe'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path (Join-Path $release.FullName '*') -DestinationPath 'dist/Vela-SHUO-Mihomo-Windows-x64-Portable.zip' -Force
          Get-FileHash 'dist/Vela-SHUO-Mihomo-Windows-x64-Portable.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Vela-SHUO-Mihomo-Windows-x64-Portable.zip" } |
            Set-Content -Path dist/SHA256-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-SHUO-Mihomo-Windows-x64
          path: dist/*
          if-no-files-found: error
          retention-days: 14
