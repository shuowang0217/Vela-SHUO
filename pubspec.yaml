name: vela_shuo
description: Vela cross-platform network client.
publish_to: none
version: 1.6.0+27

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3
  file_selector: ^1.1.0
  yaml: ^3.1.3
  dio: ^5.9.0
  url_launcher: ^6.3.2
  # Original FlClash Windows native system-proxy plugin, pinned to the SAME
  # source revision as the Go core. No FlClash Flutter screens are included.
  proxy:
    git:
      url: https://github.com/chen08209/FlClash.git
      ref: 4b59eca853778d4e7be3de26589252889c899bc5
      path: plugins/proxy
  window_manager: ^0.5.2
  tray_manager: 0.5.3
  ffi: ^2.2.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/maps/world_110m.json
    - assets/earth/earth_day.jpg
    - assets/earth/earth_night_lights.png
    - assets/world/watercolor_day.webp
    - assets/world/watercolor_night.webp
    - assets/tray/proxy_on.ico
    - assets/tray/proxy_off.ico
