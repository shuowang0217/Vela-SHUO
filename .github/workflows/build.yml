name: Vela-SHUO CI - Windows EXE + Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vela-v01a-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.4'

jobs:
  verify:
    name: Flutter static analysis and smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - name: Generate official Flutter platform scaffolding
        run: flutter create --project-name vela_shuo --org com.shuowang --platforms android,windows .
      - run: flutter pub get
      - name: Dart formatting
        run: dart format lib test
      - name: Flutter analyzer
        run: flutter analyze
      - name: Widget and identity tests
        run: flutter test --reporter expanded

  windows:
    name: Windows x64 portable EXE
    needs: verify
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - name: Generate Windows runner
        run: flutter create --project-name vela_shuo --org com.shuowang --platforms windows .
      - run: flutter pub get
      - name: Build Windows Release
        run: flutter build windows --release
      - name: Package with DLLs and data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $release = Get-ChildItem -Path 'build/windows' -Directory -Recurse |
            Where-Object { $_.Name -eq 'Release' -and (Test-Path (Join-Path $_.FullName 'vela_shuo.exe')) } |
            Select-Object -First 1
          if (-not $release) { throw 'Expected Windows binary was not found' }
          Rename-Item -Path (Join-Path $release.FullName 'vela_shuo.exe') -NewName 'Vela-SHUO.exe'
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path (Join-Path $release.FullName '*') -DestinationPath 'dist/Vela-SHUO-v0.1.0-Windows-x64-Portable.zip' -Force
          Get-FileHash 'dist/Vela-SHUO-v0.1.0-Windows-x64-Portable.zip' -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  Vela-SHUO-v0.1.0-Windows-x64-Portable.zip" } |
            Set-Content -Path dist/SHA256-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-SHUO-v0.1.0-Windows-x64-Portable
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android ARM64 DEV APK
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: master
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate Android runner
        run: flutter create --project-name vela_shuo --org com.shuowang --platforms android .
      - name: Configure temporary Android DEV package
        run: python3 scripts/configure_android_debug.py
      - run: flutter pub get
      - name: Build ARM64 debug APK
        run: flutter build apk --debug --target-platform android-arm64
      - name: Verify Android identity and prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-debug.apk
          test -s "$apk"
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -n 1)"
          test -n "$aapt_bin"
          "$aapt_bin" dump badging "$apk" | grep -F "package: name='com.shuowang.vela.dev'"
          mkdir -p dist
          cp "$apk" dist/Vela-SHUO-v0.1.0-Android-ARM64-DEV.apk
          (cd dist && sha256sum *.apk > SHA256-Android.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: Vela-SHUO-v0.1.0-Android-ARM64-DEV
          path: dist/*
          if-no-files-found: error
          retention-days: 14
